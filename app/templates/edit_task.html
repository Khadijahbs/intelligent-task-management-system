<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task | TaskFlow</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f8f5f2;
            color: #4a403b;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #8b6860;
            font-size: 14px;
        }

        .card {
            background: #fffdfb;
            padding: 35px;
            border-radius: 20px;
            border: 1px solid #eee3dd;
            box-shadow: 0 8px 30px rgba(92, 70, 60, 0.06);
        }

        h1 {
            color: #463b37;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #948781;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #5c4e48;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dfd2cb;
            border-radius: 12px;
            background: #fff;
            color: #4a403b;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #b28c82;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .reminder-box {
            background: #faf4f0;
            border: 1px solid #eadfd8;
            border-radius: 15px;
            padding: 18px;
            margin-top: 5px;
        }

        .reminder-title {
            font-size: 14px;
            font-weight: 700;
            color: #5c4e48;
            margin-bottom: 6px;
        }

        .reminder-help {
            font-size: 12px;
            color: #948781;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .clear-reminder {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 12px;
            border: none;
            border-radius: 9px;
            background: #f0e5e0;
            color: #6c554d;
            font-size: 12px;
            cursor: pointer;
        }

        .clear-reminder:hover {
            background: #e7d8d2;
        }

        .error-message {
            background: #f9e5e2;
            border: 1px solid #e7c8c2;
            color: #8a5148;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 13px 22px;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: #9b746b;
            color: white;
        }

        .btn-primary:hover {
            background: #856158;
        }

        .btn-secondary {
            background: #f0e5e0;
            color: #6c554d;
        }

        @media (max-width: 600px) {

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <a
            href="{{ url_for('auth.my_tasks') }}"
            class="back"
        >
            ← Back to My Tasks
        </a>

        <div class="card">

            <h1>Edit Task ✏️</h1>

            <p class="subtitle">
                Update your task information below.
            </p>

            {% if error_message %}

                <div class="error-message">
                    {{ error_message }}
                </div>

            {% endif %}

            <form method="POST">

                <!-- TASK TITLE -->

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ task.title }}"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                    >{{ task.description or "" }}</textarea>

                </div>


                <!-- IMPORTANCE + DEADLINE -->

                <div class="row">

                    <div class="form-group">

                        <label for="importance">
                            Importance
                        </label>

                        <select
                            name="importance"
                            id="importance"
                            required
                        >

                            <option
                                value="Low"
                                {% if task.importance == "Low" %}
                                    selected
                                {% endif %}
                            >
                                Low
                            </option>

                            <option
                                value="Medium"
                                {% if task.importance == "Medium" %}
                                    selected
                                {% endif %}
                            >
                                Medium
                            </option>

                            <option
                                value="High"
                                {% if task.importance == "High" %}
                                    selected
                                {% endif %}
                            >
                                High
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="deadline">
                            Deadline
                        </label>

                        <input
                            type="datetime-local"
                            id="deadline"
                            name="deadline"
                            value="{{ task.deadline.strftime('%Y-%m-%dT%H:%M') }}"
                            required
                        >

                    </div>

                </div>


                <!-- REMINDER -->

                <div class="form-group">

                    <div class="reminder-box">

                        <div class="reminder-title">
                            🔔 Task Reminder
                        </div>

                        <div class="reminder-help">
                            Set a reminder for this task.
                            Leave it empty if you do not want a reminder.
                        </div>

                        <label for="reminder_at">
                            Reminder Time
                        </label>

                        <input
                            type="datetime-local"
                            id="reminder_at"
                            name="reminder_at"
                            {% if task.reminder_at %}
                                value="{{ task.reminder_at.strftime('%Y-%m-%dT%H:%M') }}"
                            {% endif %}
                        >

                        {% if task.reminder_at %}

                            <button
                                type="button"
                                class="clear-reminder"
                                onclick="clearReminder()"
                            >
                                Remove Reminder
                            </button>

                        {% endif %}

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <a
                        href="{{ url_for('auth.my_tasks') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes ✦
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>

        function clearReminder() {

            document.getElementById(
                "reminder_at"
            ).value = "";

        }

    </script>

</body>

</html>
